<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>search</title>
    <link rel="stylesheet" href="../style/headfoot-style.css">
    <link rel="stylesheet" href="../style/search-page.css">
</head>

<body>
    <nav id="main">
        <div class="container">
            <div class="logo">
                <div class="image">
                    <img src="/frontend/resources/logo/973-removebg-preview.png" alt="image-logo">
                </div>
            </div>

            <div class="nav1">
                <ul class="nav1">
                    <li><a href="index.html">หน้าหลัก</a></li>
                    <li><a href="pages/find.html">ค้นหา</a></li>
                    <li><a href="pages/shop.html">ร้านค้า</a></li>
                    <li><a href="pages/article.html">บทความ</a></li>
                </ul>
            </div>

            <div class="nav2">
                <ul class="nav2">
                    <li><a href="#">เข้าสู่ระบบ</a></li>
                    <li class="space-nav2">|</li>
                    <li><a href="#">ลงทะเบียน</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section id="main">
        <div class="search-container">
            <div class="search-bar">
                <input type="text" name="shopname" id="search" placeholder="ค้นหาร้าน">
            </div>

            <form id="filter-form">

                <div class="filter-section">
                    <h2>ราคา</h2>
                    <div class="price-inputs">
                        <input type="number" id="min-price" name="minPrice" placeholder="Min" value="60">
                        <span>—</span>
                        <input type="number" id="max-price" name="maxPrice" placeholder="Max" value="500">
                    </div>
                </div>

                <div class="filter-section">
                    <h2>คะแนน</h2>
                    <div class="star-rating">
                        <input type="radio" id="star-5" name="rating" value="5"><label for="star-5">★</label>
                        <input type="radio" id="star-4" name="rating" value="4"><label for="star-4">★</label>
                        <input type="radio" id="star-3" name="rating" value="3"><label for="star-3">★</label>
                        <input type="radio" id="star-2" name="rating" value="2"><label for="star-2">★</label>
                        <input type="radio" id="star-1" name="rating" value="1"><label for="star-1">★</label>
                    </div>
                </div>

                <div class="filter-section">
                    <h2>สไตล์กาแฟ</h2>

                    <fieldset>
                        <h3>ระดับการคั่ว</h3>
                        <div class="filter-option">
                            <input type="checkbox" id="roast-light" name="roast" value="light">
                            <label for="roast-light">คั่วอ่อน</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="roast-medium" name="roast" value="medium">
                            <label for="roast-medium">คั่วกลาง</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="roast-dark" name="roast" value="dark">
                            <label for="roast-dark">คั่วเข้ม</label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <h3>วิธีการชง</h3>
                        <div class="filter-option">
                            <input type="checkbox" id="brew-espresso" name="brew" value="espresso">
                            <label for="brew-espresso">Espresso-Based</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="brew-drip" name="brew" value="drip">
                            <label for="brew-drip">Drip / Pour-over</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="brew-coldbrew" name="brew" value="coldbrew">
                            <label for="brew-coldbrew">Cold Brew</label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <h3>โปรไฟล์รสชาติ</h3>
                        <div class="filter-option">
                            <input type="checkbox" id="profile-classic" name="profile" value="classic">
                            <label for="profile-classic">Classic & Balanced</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="profile-fruity" name="profile" value="fruity">
                            <label for="profile-fruity">Fruity & Floral</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="profile-funky" name="profile" value="funky">
                            <label for="profile-funky">Funky & Fermented</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="profile-spicy" name="profile" value="spicy">
                            <label for="profile-spicy">Spicy & Earthy</label>
                        </div>
                    </fieldset>

                    <fieldset>
                        <h3>แหล่งปลูก</h3>
                        <div class="filter-option">
                            <input type="checkbox" id="origin-thai" name="origin" value="thai">
                            <label for="origin-thai">เมล็ดไทย</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="origin-africa" name="origin" value="africa">
                            <label for="origin-africa">เมล็ดแอฟริกา</label>
                        </div>
                        <div class="filter-option">
                            <input type="checkbox" id="origin-sa" name="origin" value="sa">
                            <label for="origin-sa">เมล็ดอเมริกาใต้/กลาง</label>
                        </div>
                    </fieldset>
                </div>

                <div class="filter-section">
                    <h2>บรรยากาศ</h2>
                    <div class="filter-option">
                        <input type="checkbox" id="vibe-work" name="vibe" value="work">
                        <label for="vibe-work">เหมาะกับการทำงาน</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="vibe-pet" name="vibe" value="pet">
                        <label for="vibe-pet">Pet-Friendly</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="vibe-parking" name="vibe" value="parking">
                        <label for="vibe-parking">มีที่จอดรถ</label>
                    </div>
                </div>

                <div class="filter-section">
                    <h2>อื่นๆ</h2>
                    <div class="filter-option">
                        <input type="checkbox" id="other-roastery" name="other" value="roastery">
                        <label for="other-roastery">มีโรงคั่วในร้าน</label>
                    </div>
                    <div class="filter-option">
                        <input type="checkbox" id="other-champ" name="other" value="champ">
                        <label for="other-champ">บาริสต้าดีกรีแชมป์</label>
                    </div>
                </div>
                <div class="gogobtn">
                    <button type="submit" id="gogobtn">Enter</button>
                </div>
            </form>

        </div>
    </section>
    <script src="../scripts/index.js" defer></script>
</body>

</html>
