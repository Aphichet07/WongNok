<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>อ่านบทความ</title>
    <link rel="stylesheet" href="/frontend/style/read.css" />
    <link rel="stylesheet" href="/frontend/style/footer.css" />
    <link rel="stylesheet" href="/frontend/style/nav.css" />
  </head>
  <body>
    <header id="main-nav-bar">
      <div class="container">
        <div class="nav-logo">
          <img
            src="/frontend/resources/logo/logo2.png"
            alt="logo"
            class="logo-image"
          />
        </div>
        <div class="sub-nav-bar">
          <div class="nav-bar1">
            <ul class="ul-navbar1">
              <li><a href="/frontend/index.html">Home</a></li>
              <li><a href="/frontend/pages/find.html">Search</a></li>
              <li><a href="/frontend/pages/article.html">Article</a></li>
              <li><a href="/frontend/pages/aboutus.html">About us</a></li>
            </ul>
          </div>
          <div class="nav-bar2">
            <ul class="ul-navbar2">
              <li><a href="#" id="open-signin">SignIn</a></li>
              <li>|</li>
              <li><a href="#" id="open-signup">SignUp</a></li>
            </ul>
          </div>
        </div>
      </div>
    </header>

    <main class="article-container">
      <div class="content-wrapper">
        <a href="/frontend/pages/article.html" class="back-btn"
          >← กลับไปหน้ารวมบทความ</a
        >

        <header class="article-header">
          <div class="article-meta">
            <span id="article-tag" class="tag-badge">General</span>
            <span id="article-date">Loading...</span>
          </div>
          <h1 id="article-title">กำลังโหลด...</h1>
          <div class="author-info">
            <img
              src="/frontend/resources/avatar-placeholder.png"
              alt="author"
              class="author-avatar"
            />
            <div class="author-text">
              <span id="article-author">Unknown Author</span>
              <span id="article-views">0 views</span>
            </div>
          </div>
        </header>

        <div class="image-container">
          <img id="article-cover" src="" alt="Cover Image" />
        </div>

        <article id="article-content" class="article-body"></article>

        <hr class="divider" />

        <section class="comment-section">
          <h3>ความคิดเห็น (<span id="comment-count">0</span>)</h3>

          <div class="comment-form-box">
            <form id="comment-form">
              <textarea
                name="comment"
                placeholder="แสดงความคิดเห็นของคุณ..."
                rows="3"
              ></textarea>
              <div class="form-footer">
                <span id="current-user-name">กรุณาเข้าสู่ระบบก่อนคอมเมนต์</span>
                <button type="submit" class="btn-submit">ส่งคอมเมนต์</button>
              </div>
            </form>
          </div>

          <div id="comment-list">
            <p class="loading-text">กำลังโหลดความคิดเห็น...</p>
          </div>
        </section>
      </div>
    </main>

    <footer class="main"></footer>

    <div id="auth-modal" class="auth-modal">
      <div class="auth-modal__overlay"></div>

      <div class="auth-modal__content">
        <button class="auth-modal__close" aria-label="ปิดหน้าต่าง">
          &times;
        </button>

        <div class="auth-modal__tabs">
          <button class="tab-btn active" data-tab="signin">Sign in</button>
          <button class="tab-btn" data-tab="signup">Sign up</button>
        </div>

        <form class="auth-form active" id="signin-form">
          <label>
            ชื่อผู้ใช้
            <input
              type="username"
              name="username"
              placeholder="Bank007"
              required
            />
          </label>
          <label>
            รหัสผ่าน
            <input
              type="password"
              name="password"
              placeholder="••••••••"
              required
            />
          </label>
          <button type="submit" class="auth-submit">เข้าสู่ระบบ</button>
        </form>

        <form class="auth-form" id="signup-form">
          <label>
            ชื่อผู้ใช้
            <input
              type="text"
              name="username"
              placeholder="ชื่อที่จะแสดงในระบบ"
              required
            />
          </label>
          <label>
            อีเมล
            <input
              type="email"
              name="email"
              placeholder="you@example.com"
              required
            />
          </label>
          <label>
            รหัสผ่าน
            <input
              type="password"
              name="password"
              placeholder="อย่างน้อย 8 ตัวอักษร"
              required
            />
          </label>
          <button type="submit" class="auth-submit">สมัครสมาชิก</button>
        </form>
      </div>
    </div>

    <script src="/frontend/scripts/auth.js"></script>
    <script src="/frontend/scripts/nav.js"></script>
    <script type="module" src="/frontend/scripts/pages/read.js"></script>
  </body>
</html>
